services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  airport-service:
    build:
      context: ../..
      dockerfile: services/airport-service/Dockerfile
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":9091"
      COLOMBIA_API_BASE_URL: "https://api-colombia.com"
      UPSTREAM_TIMEOUT_MS: "8000"
      CACHE_TTL_MS: "300000"
      REDIS_ADDR: "redis:6379"
      CB_FAILURE_THRESHOLD: "5"
      CB_COOLDOWN_MS: "30000"
      BULKHEAD_MAX_CONCURRENT: "8"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      GRPC_MTLS_ENABLED: "true"
      GRPC_TLS_CERT_FILE: /certs/server.crt
      GRPC_TLS_KEY_FILE: /certs/server.key
      GRPC_TLS_CA_FILE: /certs/ca.crt
    volumes:
      - ../certs/grpc:/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  itinerary-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itinerary
      POSTGRES_PASSWORD: itinerary
      POSTGRES_DB: itinerary
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itinerary -d itinerary"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - airport-service

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "8474:8474"
      - "18475:8475"
    volumes:
      - ../toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    depends_on:
      - airport-service

  itinerary-service:
    build:
      context: ../..
      dockerfile: services/itinerary-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      HTTP_ADDR: ":8082"
      DATABASE_URL: postgres://itinerary:itinerary@itinerary-db:5432/itinerary?sslmode=disable
      AIRPORT_SERVICE_URL: http://airport-service:8081
      AIRPORT_GRPC_ADDR: airport-service:9091
      AIRPORT_HTTP_TIMEOUT_MS: "5000"
      AIRPORT_GRPC_MTLS_ENABLED: "true"
      AIRPORT_GRPC_TLS_CERT_FILE: /certs/client.crt
      AIRPORT_GRPC_TLS_KEY_FILE: /certs/client.key
      AIRPORT_GRPC_TLS_CA_FILE: /certs/ca.crt
      AIRPORT_GRPC_SERVER_NAME: airport-service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      OUTBOX_RELAY_ENABLED: "true"
      OUTBOX_POLL_INTERVAL_MS: "2000"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    volumes:
      - ../certs/grpc:/certs:ro
    depends_on:
      airport-service:
        condition: service_started
      itinerary-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  notification-function:
    build:
      context: ../../services/notification-function
    ports:
      - "8083:8083"
    environment:
      HTTP_ADDR: ":8083"
      DATABASE_URL: postgres://notify:notify@notification-db:5432/notify?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      itinerary-service:
        condition: service_started

  api-gateway:
    build:
      context: ../../services/api-gateway
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      AIRPORT_SERVICE_URL: http://airport-service:8081
      ITINERARY_SERVICE_URL: http://itinerary-service:8082
      JWT_SIGNING_KEY: dev-only-change-me
      JWT_ISSUER: personal-itineraries-gateway
      RATE_LIMIT_RPS: "20"
      RATE_LIMIT_BURST: "40"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    depends_on:
      - airport-service
      - itinerary-service
      - jaeger

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080
        NEXT_PUBLIC_AIRPORT_API_URL: http://localhost:8080
        NEXT_PUBLIC_ITINERARY_API_URL: http://localhost:8080
    ports:
      # Host 3000 is often taken by another local Next app — expose on 3001.
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080
      NEXT_PUBLIC_AIRPORT_API_URL: http://localhost:8080
      NEXT_PUBLIC_ITINERARY_API_URL: http://localhost:8080
    depends_on:
      - api-gateway
