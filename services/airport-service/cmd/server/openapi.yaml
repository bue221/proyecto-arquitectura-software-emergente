openapi: 3.0.3
info:
  title: Airport Service API
  version: 1.0.0
  description: Internal airport catalog adapted from API Colombia. Frontend must use these DTOs only.
servers:
  - url: http://localhost:8081
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: OK
  /api/v1/airports:
    get:
      summary: List airports for Plotly map
      operationId: listAirportsForMap
      responses:
        "200":
          description: Plotly-ready points
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  points:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlotlyPoint"
        "503":
          description: Upstream unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/airports/{id}:
    get:
      summary: Get airport by internal id
      operationId: getAirportById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Airport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Airport"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Upstream unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Airport:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        iataCode: { type: string }
        oaciCode: { type: string }
        type: { type: string }
        city: { type: string }
        lat: { type: number }
        lon: { type: number }
    PlotlyPoint:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        iata: { type: string }
        lat: { type: number }
        lon: { type: number }
        text: { type: string }
    Problem:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        trace_id: { type: string }
