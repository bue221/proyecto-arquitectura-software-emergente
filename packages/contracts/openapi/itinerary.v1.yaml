openapi: 3.0.3
info:
  title: Itinerary Service API
  version: 1.0.0
  description: |
    Canonical OpenAPI copy for Itinerary Service.
    URI versioning under `/api/v1`; responses include `API-Version: 1`.
    List supports offset pagination via `page` / `pageSize`.
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/v1/itineraries:
    get:
      summary: List itineraries (paginated)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated list
    post:
      summary: Create itinerary
      responses:
        "201":
          description: Created
  /api/v1/itineraries/{id}:
    get:
      summary: Get itinerary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    put:
      summary: Update itinerary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete itinerary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
