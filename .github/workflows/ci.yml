name: ci

on:
  pull_request:
  push:
    branches: [main]

# Level 3: tests only for now — keep wall clock under 3 minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: |
            packages/proto/go.sum
            services/airport-service/go.sum
            services/itinerary-service/go.sum
            services/api-gateway/go.sum
            services/notification-function/go.sum

      - name: Test packages/proto
        run: go test ./... -count=1 -timeout 45s
        working-directory: packages/proto

      - name: Test airport-service
        run: go test ./... -count=1 -timeout 45s
        working-directory: services/airport-service

      - name: Test itinerary-service
        # -short skips Testcontainers so PR CI stays under 3 minutes.
        run: go test ./... -count=1 -short -timeout 45s
        working-directory: services/itinerary-service

      - name: Test api-gateway
        run: go test ./... -count=1 -timeout 45s
        working-directory: services/api-gateway

      - name: Test notification-function
        run: go test ./... -count=1 -timeout 45s
        working-directory: services/notification-function
