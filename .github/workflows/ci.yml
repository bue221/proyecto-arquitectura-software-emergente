name: ci

on:
  pull_request:
  push:
    branches: [main]

# Unit tests stay under ~3 minutes; docker-build runs in parallel with GHA layer cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: |
            packages/proto/go.sum
            services/airport-service/go.sum
            services/itinerary-service/go.sum
            services/api-gateway/go.sum
            services/notification-function/go.sum

      - name: Test packages/proto
        run: go test ./... -count=1 -timeout 45s
        working-directory: packages/proto

      - name: Test airport-service
        run: go test ./... -count=1 -timeout 45s
        working-directory: services/airport-service

      - name: Test itinerary-service
        # -short skips Testcontainers so PR CI stays under 3 minutes.
        run: go test ./... -count=1 -short -timeout 45s
        working-directory: services/itinerary-service

      - name: Test api-gateway
        run: go test ./... -count=1 -timeout 45s
        working-directory: services/api-gateway

      - name: Test notification-function
        run: go test ./... -count=1 -timeout 45s
        working-directory: services/notification-function

  web-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

  docker-build:
    name: Docker build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: airport-service
            context: .
            file: services/airport-service/Dockerfile
          - name: itinerary-service
            context: .
            file: services/itinerary-service/Dockerfile
          - name: api-gateway
            context: services/api-gateway
            file: services/api-gateway/Dockerfile
          - name: notification-function
            context: services/notification-function
            file: services/notification-function/Dockerfile
          - name: web
            context: apps/web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          tags: rutaco-${{ matrix.name }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
