name: cd-example

# Minimal continuous delivery: build Go service images and push to GHCR.
# Academic evidence for RNF-D2 — not a production cluster deploy.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-example-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: airport-service
            context: .
            file: services/airport-service/Dockerfile
          - name: itinerary-service
            context: .
            file: services/itinerary-service/Dockerfile
          - name: api-gateway
            context: services/api-gateway
            file: services/api-gateway/Dockerfile
          - name: notification-function
            context: services/notification-function
            file: services/notification-function/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rutaco-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-example:
    name: Deploy example (manifest)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Record CD artifact pointers
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA_SHORT="${GITHUB_SHA::7}"
          OUT="infra/k8s/cd-example-images.env"
          {
            echo "# Generated by cd-example.yml — pull these tags after a green CD run"
            echo "AIRPORT_IMAGE=ghcr.io/${OWNER}/rutaco-airport-service:sha-${SHA_SHORT}"
            echo "ITINERARY_IMAGE=ghcr.io/${OWNER}/rutaco-itinerary-service:sha-${SHA_SHORT}"
            echo "GATEWAY_IMAGE=ghcr.io/${OWNER}/rutaco-api-gateway:sha-${SHA_SHORT}"
            echo "NOTIFY_IMAGE=ghcr.io/${OWNER}/rutaco-notification-function:sha-${SHA_SHORT}"
            echo "K8S_DIR=infra/k8s"
            echo "# Apply locally after docker login ghcr.io:"
            echo "#   kubectl apply -f infra/k8s/"
          } | tee "$OUT"
          echo "::notice::CD example published image tags written to $OUT (artifact only; no live cluster)."

      - name: Upload image pointer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cd-example-images
          path: infra/k8s/cd-example-images.env
