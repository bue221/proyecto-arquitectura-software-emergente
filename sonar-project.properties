# SonarCloud — monorepo Personal Itineraries (RutaCO)
# Requires GitHub secret SONAR_TOKEN and a SonarCloud project linked to this repo.
# Docs: docs/04-devops/quality.md

sonar.projectKey=bue221_proyecto-arquitectura-software-emergente
sonar.organization=bue221
sonar.projectName=proyecto-arquitectura-software-emergente

sonar.sources=services,packages,apps/web
sonar.tests=services,packages
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/migrations/**,infra/certs/**

sonar.go.coverage.reportPaths=\
  services/airport-service/coverage.out,\
  services/itinerary-service/coverage.out,\
  services/api-gateway/coverage.out,\
  services/notification-function/coverage.out,\
  packages/proto/coverage.out

sonar.sourceEncoding=UTF-8
